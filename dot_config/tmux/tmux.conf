# ==========================================
# TMUX CONFIGURATION
# ==========================================
# Managed via Chezmoi (source: dot_config/tmux/tmux.conf).
# Renders to ~/.config/tmux/tmux.conf — tmux's preferred XDG location
# since version 3.2; tmux loads it automatically ahead of ~/.tmux.conf.
# Convention: every line below has a comment explaining its purpose and
# the option name + value so the file can be skimmed without consulting
# `man tmux`. Grouped into themed sections.

# ==========================================
# PREFIX KEYS
# ==========================================
# Two prefixes are bound so muscle memory from both GNU Screen (C-a) and
# stock tmux (C-b) work without remapping. C-a is the primary prefix;
# C-b is exposed as a secondary prefix via `prefix2` (tmux 3.0+), which
# keeps the primary binding intact and accepts the same follow-up keys.
unbind C-b
set -g prefix C-a
set -g prefix2 C-b
# Allow pressing C-a twice to send a literal C-a to the application
# inside the current pane (e.g. when an editor expects C-a as a binding).
bind C-a send-prefix

# ==========================================
# MOUSE & TERMINAL CAPABILITIES
# ==========================================
# Single modern toggle for click-to-select, drag-to-resize, and wheel
# scrolling. Replaces the older mouse-resize-pane / mouse-select-pane /
# mouse-select-window trio that pre-dates tmux 2.1.
set -g mouse on

# Forward focus-gained / focus-lost escape sequences to the application.
# Required for Neovim's FocusGained/FocusLost autocmds and for apps that
# pause rendering (e.g. :terminal insert-mode) when the pane loses focus.
set -g focus-events on

# Pass through extended key sequences (Shift+Arrow, Ctrl+Arrow, modern
# kitty/WezTerm CSI-u protocols). Without this, several key combos that
# Neovim, fzf, and TUI tools rely on are silently swallowed by tmux.
# Added in tmux 3.4.
set -s extended-keys on

# Eliminate the (default ~500 ms) delay tmux waits before forwarding an
# ESC keypress to the application. Neovim handles its own ESC timing, so
# any non-zero value just adds latency to every Escape press.
set -sg escape-time 0

# Allow OSC 52 escape sequences to flow through tmux untouched so
# applications can write directly to the local clipboard. Pairs with
# Neovim's `vim.g.clipboard = 'osc52'` and Alacritty's built-in OSC 52
# handler. Works over SSH: yank in Neovim on the remote → paste locally.
# Added in tmux 3.2.
set -s set-clipboard on

# `tmux-256color` is a tmux-specific terminfo that advertises the
# capabilities tmux itself provides (bracketed paste, RGB, etc.).
# Pairing it with the `RGB` terminal-feature override below enables
# truecolor (24-bit) escape sequences inside the pane, which TUI tools
# such as Neovim (:set termguicolors), ls --color, and bat require.
set -g default-terminal "tmux-256color"
# Append `Tc` so tmux advertises the synchronized-output (mode 2026) capability
# to programs inside the pane. Btop, helix, lazygit, fzf, and any TUI that
# issues CSI ? 2026 h/l around its frame buffer relies on this to avoid
# half-drawn braille/box-drawing cells during high-frequency redraws.
set-option -as terminal-features ",xterm*:RGB,Tc"

# ==========================================
# WINDOW & PANE INDEXING
# ==========================================
# Start numbering at 1 to match how most users reference tmux windows in
# conversation (and to match how shell scripts written by humans tend to
# index arrays). 0 is the default and is jarring on first encounter.
set -g base-index 1
setw -g pane-base-index 1

# Re-number surviving windows in sequence whenever one closes, so the
# active window's number does not change unexpectedly when a sibling is
# killed.
set -g renumber-windows on

# 50,000 lines of scrollback per pane — large enough for long compile
# output or `git log` sessions, small enough that switching panes
# remains instant on most machines. Default is 2,000.
set -g history-limit 50000

# Aggressively resize the layout to whichever client is active. When
# you `tmux attach` from a phone or second laptop to the same session
# the desktop is driving, the visible layout follows the active client
# instead of getting squeezed into the smallest viewport.
setw -g aggressive-resize on

# Disable automatic window renaming. Programs like ssh, vim, and shells
# set their own window title via OSC 0/2; letting them do it leads to
# titles that drift from the project name. Setting this `off` keeps the
# window title at whatever you set with `prefix ,` (rename-window).
set -g allow-rename off

# Show a quiet dot in the window list whenever a pane in that window
# has had activity. `visual-activity off` keeps the dot silent (no
# status-bar flash) — the indicator is purely visual-in-list.
setw -g monitor-activity on
set -g visual-activity off

# Tighter repeat window for `-r` bindings (default 500 ms). After
# pressing the prefix + a repeatable key, follow-up key presses within
# 300 ms do not need the prefix again — makes pane-swap and resize feel
# snappier when chaining several moves in a row.
set -g repeat-time 300

# ==========================================
# PANE SPLITTING
# ==========================================
# Primary mnemonics: `|` looks like a vertical divider for left|right,
# `-` like a horizontal divider for top/bottom. No Shift required —
# faster than the defaults and visually obvious.
bind |  split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
# Secondary bindings: keep the tmux defaults (`%` and `"`) so muscle
# memory from old habits and shared screen recordings still work. Both
# keys require Shift.
bind %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# -c "#{pane_current_path}" inherits the working directory of the source
# pane into the new pane; the default is $HOME, which surprises users.

# ==========================================
# PANE NAVIGATION (PREFIXED, vim-style)
# ==========================================
# Mirror the hjkl layout used by Vim/Neovim so that the mental model
# for moving the cursor also moves the active pane. These bindings
# require the prefix (C-a) first.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ==========================================
# PANE NAVIGATION (NO PREFIX, arrow keys)
# ==========================================
# For users who prefer arrow keys, Alt+Arrow switches panes without the
# prefix. The `-n` flag makes the binding root-level (active
# immediately). Useful for moving between panes while typing — the
# chord is short enough that it never collides with normal text input
# in shells or editors.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ==========================================
# PANE SWAP (vim-style, uppercase hjkl)
# ==========================================
# Lowercase hjkl moves focus; uppercase HJKL moves the pane itself.
# Mnemonic: lowercase navigates, uppercase manipulates. `-r` makes the
# binding repeatable — hold the prefix once and tap H/J/K/L repeatedly
# to push the pane several positions without re-pressing the prefix.
bind -r H select-pane -L \; swap-pane -s '!' \; display-message "Pane swapped left"
bind -r J select-pane -D \; swap-pane -s '!' \; display-message "Pane swapped down"
bind -r K select-pane -U \; swap-pane -s '!' \; display-message "Pane swapped up"
bind -r L select-pane -R \; swap-pane -s '!' \; display-message "Pane swapped right"

# ==========================================
# COPY MODE (vi bindings, matching hjkl)
# ==========================================
# tmux defaults to emacs-style copy-mode keybindings, which contradicts
# the vim-style hjkl pane navigation above. Switching the mode table to
# vi lets users scroll, search, and select using the same muscle memory
# they use for editing.
setw -g mode-keys vi
# `v` enters visual/selection mode (mirrors Vim's visual mode entry).
bind -T copy-mode-vi v send-keys -X begin-selection
# `V` enters visual-line mode (mirrors Vim's capital-V line selection).
bind -T copy-mode-vi V send-keys -X select-line
# `C-v` toggles rectangular / block selection (mirrors Vim's C-v).
# Useful for capturing column-aligned data such as log tables or diffs.
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# `y` yanks the selection and exits copy-mode (mirrors Vim's yank).
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# ==========================================
# BUFFER PASTE (no copy-mode)
# ==========================================
# Capital `P` pastes the last tmux buffer into the current pane without
# entering copy mode. Faster than `prefix ]` for repeated pastes.
bind P paste-buffer

# ==========================================
# WINDOW NAVIGATION
# ==========================================
# `C-h` and `C-l` step through the window list backward / forward
# without re-pressing the prefix. `-r` makes them repeatable so holding
# either key walks through several windows.
bind -r C-h previous-window
bind -r C-l next-window
# Swap the current window left / right in the window list using `<` /
# `>` (mnemonic: `<` points left, `>` points right). Useful for
# reordering windows after the fact.
bind -r < swap-window -d -t :-1
bind -r > swap-window -d -t :+1

# ==========================================
# MOUSE-DRIVEN CLIPBOARD BRIDGE (Wayland)
# ==========================================
# When the user drags to select text inside a pane, pipe the selection
# directly to `wl-copy` so it lands in the system clipboard. Avoids
# the awkward "select, prefix+[, Enter, prefix+] to copy" dance.
# Using Wayland's wl-copy; swap to `xclip -selection clipboard` on X11.
# Note: with `set-clipboard on` above, OSC-52-capable apps (Neovim
# 0.10+, kitty, etc.) already reach the clipboard through tmux without
# this bridge — these bindings cover the rest.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# ==========================================
# STATUS BAR
# ==========================================
# Refresh the status line every 5 seconds so the clock on the right
# updates without manual input. The default of 15s feels laggy.
set -g status-interval 5
# Left-justify the window list so it grows rightward as windows open.
set -g status-justify left
# Session name in green on the left (gives "where am I?" at a glance).
set -g status-left ' #[fg=green]#S '
# ISO date + 24h clock on the right.
set -g status-right '#[fg=white] %Y-%m-%d %H:%M '
# Inactive windows: short " #I:#W " format (#I = index, #W = name).
setw -g window-status-format ' #I:#W '
# Active window: bold + green to make it pop against the others.
setw -g window-status-current-format '#[fg=green,bold] #I:#W '
# Render the status bar at the top of the terminal instead of the
# bottom. Frees the bottom row for the cursor and matches most modern
# terminal aesthetics.
set -g status-position top
# Color the pane borders so the active pane is obvious at a glance.
# Inactive panes use a dim grey; the active pane uses the same green as
# the active-window indicator in the status bar.
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#00e68a'
# Per-pane scrollbars showing scrollback position. Added in tmux 3.6.
# Each pane gets a thin bar on the right that visualizes how far into
# the scrollback history you are when in copy mode. Costs ~1 cell of
# pane width. If the visual clutter becomes distracting in cramped
# layouts, comment both lines out — the feature is purely visual and
# mouse scrolling still works without it.
set -g pane-scrollbars on
set -g pane-scrollbars-position right

# ==========================================
# UTILITIES
# ==========================================
# Reload this configuration on Prefix + r.
# - `#{config_files}` is a tmux format variable that expands to the
#   actual path tmux loaded (usually ~/.tmux.conf on chezmoi-managed
#   systems), so the binding keeps working if the file is relocated.
# - `-q` suppresses the "no such file" error if the format ever
#   expands to a stale path.
# - `display "..."` pops a one-line confirmation message.
unbind r
bind r source-file -q "#{config_files}" \; display "Config reloaded!"

# ==========================================
# PLUGIN MANAGER (TPM)
# ==========================================
# Tmux Plugin Manager (https://github.com/tmux-plugins/tpm) is the
# de-facto plugin installer. The clone itself is managed by chezmoi —
# see `.chezmoiexternals/tpm.yaml` — which clones/pulls this repo into
# `~/.tmux/plugins/tpm` on every `chezmoi apply`. Once that is in place,
# add plugins with `set -g @plugin 'owner/repo'` and press Prefix+I to
# install them. The `run` line below MUST be the last line of the file
# so that plugins attach on top of the base configuration.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# tmux-resurrect: save and restore tmux sessions across reboots. Manual
# save with `prefix Ctrl-s`, manual restore with `prefix Ctrl-r`. Saves
# windows, panes, layouts, working directories, and (optionally) the
# programs running inside each pane.
set -g @plugin 'tmux-plugins/tmux-resurrect'
# tmux-continuum: automatic companion to resurrect. Saves the session
# on a timer (default every 15 min) and restores the last save on tmux
# startup. Set `continuum-restore 'on'` below so the very first tmux
# launch after a reboot brings everything back without manual input.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# tmux-prefix-highlight: color-flips the status bar background when the
# prefix is held, removing the "did I press it?" ambiguity. Works with
# both `prefix` and `prefix2`.
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# tmux-battery: show battery percentage in the status bar. The plugin
# auto-disables itself on hosts without a battery (servers, VMs), so it
# is safe to leave loaded everywhere.
set -g @plugin 'tmux-plugins/tmux-battery'
# Auto-install plugins on first launch. The check looks for the
# resurrect plugin directory; if it is missing, TPM is asked to fetch
# every plugin declared above. On subsequent launches the directory
# exists and the check is skipped, so the cost is paid exactly once.
# Lives just before the `run` line so the manual `prefix I` step after
# a fresh `chezmoi apply` is no longer needed.
if "test ! -d ~/.tmux/plugins/tmux-resurrect" \
   "run '~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
