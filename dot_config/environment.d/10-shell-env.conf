# ~/.config/environment.d/10-shell-env.conf
# Read by systemd-environment-d-generator for the systemd user manager.
# It sets the environment for services the user manager starts, so a terminal
# emulator, an IDE and an agent launched from the desktop all inherit it.
#
# BASH_ENV is the only startup hook that a non-interactive bash reads.
# This host sets it nowhere else, so `bash -c` (the shell an agent uses)
# would otherwise never see ~/.shell/env/path.sh.
BASH_ENV=${HOME}/.shell/env/path.sh
