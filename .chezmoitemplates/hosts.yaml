# Host profiles for the per-machine switch.
#
# The key is the hostname chezmoi reports: the host name up to the first
# dot. A host that is not in this table falls back to the _default profile
# and chezmoi prints a warning, so a renamed laptop never silently
# receives another host's settings.
#
# The hostname is not a secret. It is not an account, and it grants no
# access on its own.
IKM202300278:
  label: work-laptop
  opencode_cli_extra: true

_default:
  label: default
  opencode_cli_extra: false
