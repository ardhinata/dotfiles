paths:
  /benchmarks:
    get:
      description: Unified benchmark endpoint that aggregates scores from multiple benchmark sources (Artificial Analysis, Design Arena, and OpenRouter's own tau-bench, GPQA, and web-search evals). Filter
        by source to reproduce the exact shapes from the legacy per-source endpoints, or use task_type to find models suited for specific workloads. Use task_type=search (or a search_* benchmark_type) for
        OpenRouter's search benchmarks, which publish each model's highest-scoring eligible evaluation configuration with same-configuration runs combined by task-weighted mean. Authenticate with any valid
        OpenRouter API key. Rate-limited to 30 requests/minute per key and 500 requests/day per account.
      operationId: getBenchmarks
      parameters:
      - description: Benchmark source to query. Determines the shape of the returned items. When omitted, returns results from all sources.
        in: query
        name: source
        required: false
        schema:
          description: Benchmark source to query. Determines the shape of the returned items. When omitted, returns results from all sources.
          enum:
          - artificial-analysis
          - design-arena
          - openrouter
          example: artificial-analysis
          type: string
          x-speakeasy-unknown-values: allow
      - description: Filter results by task type. For Artificial Analysis, maps to the corresponding index. For Design Arena, maps to the matching category. `search` returns OpenRouter search benchmark
          results only.
        in: query
        name: task_type
        required: false
        schema:
          description: Filter results by task type. For Artificial Analysis, maps to the corresponding index. For Design Arena, maps to the matching category. `search` returns OpenRouter search benchmark
            results only.
          enum:
          - coding
          - intelligence
          - agentic
          - search
          example: coding
          type: string
          x-speakeasy-unknown-values: allow
      - description: Return results for one exact OpenRouter benchmark. A `search_*` value narrows the response to search results only; a classic value narrows the OpenRouter items and leaves other sources'
          items as they are.
        in: query
        name: benchmark_type
        required: false
        schema:
          description: Return results for one exact OpenRouter benchmark. A `search_*` value narrows the response to search results only; a classic value narrows the OpenRouter items and leaves other sources'
            items as they are.
          enum:
          - gpqa_diamond
          - tau_bench_verified_airline
          - search_browsecomp
          - search_hle
          - search_dsqa
          - search_widesearch
          example: search_widesearch
          type: string
          x-speakeasy-unknown-values: allow
      - description: 'Search benchmarks only: include the published lane configuration whitelist in each search item. Defaults to false. The whitelist is limited to agent turn count, reasoning effort, and
          temperature so future harness configuration changes do not change the public contract.'
        in: query
        name: include_run_config
        required: false
        schema:
          default: false
          description: 'Search benchmarks only: include the published lane configuration whitelist in each search item. Defaults to false. The whitelist is limited to agent turn count, reasoning effort,
            and temperature so future harness configuration changes do not change the public contract.'
          example: true
          type: boolean
      - description: 'OpenRouter search benchmarks only: filter by the search engine used.'
        in: query
        name: search_engine
        required: false
        schema:
          description: 'OpenRouter search benchmarks only: filter by the search engine used.'
          example: exa
          type: string
      - description: 'OpenRouter search benchmarks only: filter by the request surface the lane ran on.'
        in: query
        name: search_surface
        required: false
        schema:
          description: 'OpenRouter search benchmarks only: filter by the request surface the lane ran on.'
          enum:
          - server-tool
          - plugin
          example: server-tool
          type: string
          x-speakeasy-unknown-values: allow
      - description: 'Design Arena only: arena to query. Defaults to `models` when source is `design-arena`.'
        in: query
        name: arena
        required: false
        schema:
          description: 'Design Arena only: arena to query. Defaults to `models` when source is `design-arena`.'
          enum:
          - models
          - builders
          - agents
          example: models
          type: string
          x-speakeasy-unknown-values: allow
      - description: 'Design Arena only: category within the arena (e.g. `codecategories`, `uicomponent`, `gamedev`, `3d`, `dataviz`, `image`, `video`, `svg`). When omitted, returns all categories.'
        in: query
        name: category
        required: false
        schema:
          description: 'Design Arena only: category within the arena (e.g. `codecategories`, `uicomponent`, `gamedev`, `3d`, `dataviz`, `image`, `video`, `svg`). When omitted, returns all categories.'
          example: codecategories
          type: string
      - description: Maximum number of items to return. When omitted, all matching results are returned.
        in: query
        name: max_results
        required: false
        schema:
          description: Maximum number of items to return. When omitted, all matching results are returned.
          example: 50
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - agentic_index: 58.3
                  coding_index: 65.8
                  display_name: GPT-4o
                  intelligence_index: 71.2
                  model_permaslug: openai/gpt-4o
                  pricing:
                    completion: '0.00001'
                    prompt: '0.0000025'
                  source: artificial-analysis
                - accuracy: 0.72
                  accuracy_stddev: 0.03
                  avg_cost_per_task: 0.002
                  benchmark_type: gpqa_diamond
                  display_name: GPT-4o
                  last_run_timestamp: '2026-06-03T12:00:00Z'
                  model_permaslug: openai/gpt-4o
                  source: openrouter
                  total_tasks: 300
                meta:
                  as_of: '2026-06-03T12:00:00Z'
                  citation: null
                  model_count: 1
                  source: null
                  source_url: null
                  task_type: null
                  version: v1
              schema:
                $ref: '#/components/schemas/UnifiedBenchmarksResponse'
          description: Benchmark results filtered by the specified source and optional task type.
        '400':
          content:
            application/json:
              example:
                error:
                  code: 400
                  message: Invalid request parameters
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
          description: Bad Request - Invalid request parameters or malformed input
        '401':
          content:
            application/json:
              example:
                error:
                  code: 401
                  message: Missing Authentication header
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
          description: Unauthorized - Authentication required or invalid credentials
        '429':
          content:
            application/json:
              example:
                error:
                  code: 429
                  message: Rate limit exceeded
              schema:
                $ref: '#/components/schemas/TooManyRequestsResponse'
          description: Too Many Requests - Rate limit exceeded
        '500':
          content:
            application/json:
              example:
                error:
                  code: 500
                  message: Internal Server Error
              schema:
                $ref: '#/components/schemas/InternalServerResponse'
          description: Internal Server Error - Unexpected server error
      summary: List Benchmarks
      tags:
      - Benchmarks
    parameters:
    - $ref: '#/components/parameters/AppIdentifier'
    - $ref: '#/components/parameters/AppDisplayName'
    - $ref: '#/components/parameters/AppCategories'
  /classifications/task:
    get:
      description: 'Returns the market-share breakdown of OpenRouter traffic by task classification

        (e.g. code generation, web search, summarization) over a trailing time window.


        Each classification reports its share of classified sampled requests (`usage_share`)

        and classified sampled token volume (`token_share`) as fractions between 0 and 1.

        The unclassified `other` bucket is excluded. Absolute volumes are not exposed

        because the underlying data is sampled.


        Each classification also includes a `models` array listing the top models by

        request volume within that classification, with their within-tag usage and token shares.


        Classifications are grouped into macro-categories (Code, Data, Agent, General)

        with aggregate shares provided for each.


        Authenticate with any valid OpenRouter API key (same key used for inference).

        Rate-limited to 30 requests/minute per key and 500 requests/day per account.


        When republishing or quoting this data, cite as:

        "Source: OpenRouter (openrouter.ai/rankings), as of {as_of}."'
      operationId: getTaskClassifications
      parameters:
      - description: Trailing time window for the classification data. Currently only `7d` (trailing 7 days) is supported.
        in: query
        name: window
        required: false
        schema:
          default: 7d
          description: Trailing time window for the classification data. Currently only `7d` (trailing 7 days) is supported.
          enum:
          - 7d
          example: 7d
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  as_of: '2026-06-17'
                  classifications:
                  - category_token_share: 0.48
                    category_usage_share: 0.51
                    display_name: Code Generation
                    macro_category: code
                    models:
                    - id: openai/gpt-4.1-mini
                      tag_token_share: 0.75
                      tag_usage_share: 0.55
                    tag: code:general_impl
                    token_share: 0.31
                    usage_share: 0.23
                  macro_categories:
                  - key: code
                    label: Code
                    token_share: 0.52
                    usage_share: 0.45
                  window_days: 7
              schema:
                $ref: '#/components/schemas/TaskClassificationResponse'
          description: Task classification market-share data for the requested trailing window.
        '400':
          content:
            application/json:
              example:
                error:
                  code: 400
                  message: Invalid request parameters
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
          description: Bad Request - Invalid request parameters or malformed input
        '401':
          content:
            application/json:
              example:
                error:
                  code: 401
                  message: Missing Authentication header
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
          description: Unauthorized - Authentication required or invalid credentials
        '429':
          content:
            application/json:
              example:
                error:
                  code: 429
                  message: Rate limit exceeded
              schema:
                $ref: '#/components/schemas/TooManyRequestsResponse'
          description: Too Many Requests - Rate limit exceeded
        '500':
          content:
            application/json:
              example:
                error:
                  code: 500
                  message: Internal Server Error
              schema:
                $ref: '#/components/schemas/InternalServerResponse'
          description: Internal Server Error - Unexpected server error
      summary: Task classification market share
      tags:
      - Classifications
    parameters:
    - $ref: '#/components/parameters/AppIdentifier'
    - $ref: '#/components/parameters/AppDisplayName'
    - $ref: '#/components/parameters/AppCategories'
  /datasets/app-rankings:
    get:
      description: "Returns the top public apps on OpenRouter ranked by token usage inside the requested\ndate window, matching the public apps marketplace on openrouter.ai/apps. Token totals\nare `prompt_tokens\
        \ + completion_tokens`; hidden and private apps are excluded and\ntraffic from related app aliases is merged into the canonical visible app.\n\n`sort=popular` (default) ranks by total token volume\
        \ inside the window.\n`sort=trending` ranks by absolute excess token growth: window volume minus the average\nvolume of the three equal-length periods immediately preceding the window. Apps with\n\
        no excess growth are omitted, so `trending` may return fewer than `limit` rows.\n\nFilter with `category` (marketplace category group, e.g. `coding`) or `subcategory`\n(e.g. `cli-agent`). Ranks\
        \ are re-numbered 1..N after filtering. Page with `offset` \u2014\n`rank` stays absolute, so the first row of `offset=50` is `rank: 51`.\n\nAuthenticate with any valid OpenRouter API key (same key\
        \ used for inference).\nRate-limited to 30 requests/minute per key and 500 requests/day per account.\n\nWhen republishing or quoting this dataset, OpenRouter must be cited as:\n\"Source: OpenRouter\
        \ (openrouter.ai/apps), as of {as_of}.\"\n\nToken counts come from each upstream provider's own tokenizer, so a token attributed\nto one app is not directly comparable to a token attributed to another\
        \ app whose\ntraffic flows through a different provider.\n\nLicensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/): reuse and republish with attribution to OpenRouter."
      operationId: getAppRankings
      parameters:
      - description: "Marketplace category group to filter by (e.g. `coding`). Only apps tagged with a subcategory inside this group are returned. Mutually combinable with `subcategory` \u2014 when both\
          \ are supplied the `subcategory` must belong to the `category` group."
        in: query
        name: category
        required: false
        schema:
          description: "Marketplace category group to filter by (e.g. `coding`). Only apps tagged with a subcategory inside this group are returned. Mutually combinable with `subcategory` \u2014 when both\
            \ are supplied the `subcategory` must belong to the `category` group."
          enum:
          - coding
          - creative
          - productivity
          - entertainment
          example: coding
          type: string
          x-speakeasy-unknown-values: allow
      - description: Marketplace subcategory to filter by (e.g. `cli-agent`). Takes precedence over `category` for the actual filter; when `category` is also supplied the pair must be consistent.
        in: query
        name: subcategory
        required: false
        schema:
          description: Marketplace subcategory to filter by (e.g. `cli-agent`). Takes precedence over `category` for the actual filter; when `category` is also supplied the pair must be consistent.
          enum:
          - cli-agent
          - ide-extension
          - cloud-agent
          - programming-app
          - native-app-builder
          - creative-writing
          - video-gen
          - image-gen
          - audio-gen
          - roleplay
          - game
          - writing-assistant
          - general-chat
          - personal-agent
          - legal
          example: cli-agent
          type: string
          x-speakeasy-unknown-values: allow
      - description: '`popular` ranks apps by total token volume inside the date window. `trending` ranks apps by absolute excess token growth: window volume minus the average volume of the three equal-length
          periods immediately preceding the window. Apps with no excess growth are omitted from `trending` results.'
        in: query
        name: sort
        required: false
        schema:
          default: popular
          description: '`popular` ranks apps by total token volume inside the date window. `trending` ranks apps by absolute excess token growth: window volume minus the average volume of the three equal-length
            periods immediately preceding the window. Apps with no excess growth are omitted from `trending` results.'
          enum:
          - popular
          - trending
          example: popular
          type: string
          x-speakeasy-unknown-values: allow
      - description: Start of the date window in YYYY-MM-DD (UTC), inclusive. Defaults to 30 days before `end_date`. The dataset begins at 2025-01-01; earlier values are clamped forward to that floor and
          the resolved value is echoed in `meta.start_date`.
        in: query
        name: start_date
        required: false
        schema:
          description: Start of the date window in YYYY-MM-DD (UTC), inclusive. Defaults to 30 days before `end_date`. The dataset begins at 2025-01-01; earlier values are clamped forward to that floor
            and the resolved value is echoed in `meta.start_date`.
          example: '2026-04-12'
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      - description: End of the date window in YYYY-MM-DD (UTC), inclusive. Defaults to the most recent completed UTC day. Must be on or after 2025-01-01; earlier values are rejected with a 400.
        in: query
        name: end_date
        required: false
        schema:
          description: End of the date window in YYYY-MM-DD (UTC), inclusive. Defaults to the most recent completed UTC day. Must be on or after 2025-01-01; earlier values are rejected with a 400.
          example: '2026-05-11'
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      - description: Maximum number of apps to return (1-100). Defaults to 50.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Maximum number of apps to return (1-100). Defaults to 50.
          example: 50
          maximum: 100
          minimum: 1
          type: integer
      - description: 'Number of ranked apps to skip before the first returned row (0-100). Defaults to 0. `rank` stays absolute, so the first row of `offset=50` is `rank: 51`.'
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: 'Number of ranked apps to skip before the first returned row (0-100). Defaults to 0. `rank` stays absolute, so the first row of `offset=50` is `rank: 51`.'
          example: 0
          maximum: 100
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - app_id: 12345
                  app_name: Cline
                  rank: 1
                  total_requests: 4321
                  total_tokens: '12345678'
                - app_id: 67890
                  app_name: Roo Code
                  rank: 2
                  total_requests: 2109
                  total_tokens: '9876543'
                meta:
                  as_of: '2026-05-12T02:00:00Z'
                  end_date: '2026-05-11'
                  start_date: '2026-04-12'
                  version: v1
              schema:
                $ref: '#/components/schemas/AppRankingsResponse'
          description: Apps ranked per the requested `sort`, re-numbered 1..N. `popular` sorts by `total_tokens` descending; `trending` sorts by absolute excess token growth descending and may return fewer
            than `limit` rows.
        '400':
          content:
            application/json:
              example:
                error:
                  code: 400
                  message: Invalid request parameters
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
          description: Bad Request - Invalid request parameters or malformed input
        '401':
          content:
            application/json:
              example:
                error:
                  code: 401
                  message: Missing Authentication header
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
          description: Unauthorized - Authentication required or invalid credentials
        '429':
          content:
            application/json:
              example:
                error:
                  code: 429
                  message: Rate limit exceeded
              schema:
                $ref: '#/components/schemas/TooManyRequestsResponse'
          description: Too Many Requests - Rate limit exceeded
        '500':
          content:
            application/json:
              example:
                error:
                  code: 500
                  message: Internal Server Error
              schema:
                $ref: '#/components/schemas/InternalServerResponse'
          description: Internal Server Error - Unexpected server error
      summary: Top apps by token usage
      tags:
      - Datasets
      x-speakeasy-pagination:
        inputs:
        - in: parameters
          name: offset
          type: offset
        - in: parameters
          name: limit
          type: limit
        outputs:
          results: $.data
        type: offsetLimit
    parameters:
    - $ref: '#/components/parameters/AppIdentifier'
    - $ref: '#/components/parameters/AppDisplayName'
    - $ref: '#/components/parameters/AppCategories'
  /datasets/rankings-daily:
    get:
      description: "Returns the top 50 public models per day by total token usage on OpenRouter, plus a\nsingle aggregated `other` row per day that sums every model outside that top 50.\nToken totals are\
        \ `prompt_tokens + completion_tokens`, matching the public rankings\nchart on openrouter.ai/rankings.\n\nEach row is a distinct `(date, model_permaslug)` pair. The `other` row uses the\nreserved\
        \ permaslug `other` and is always returned last within its date, so callers\ncan compute `top-50 traffic / total daily traffic` without a second request.\n\nOptional filters slice the dataset. `period`\
        \ (`day`/`week`/`month`) sets the time\ngrain. `modality` and `context_bucket` narrow the exact dataset by output/input\nmodality (or tool-calling activity) and request context length. `category`\
        \ and\n`language_type` instead read a sampled, upsampled dataset whose `total_tokens` are\nweekly-grain estimates \u2014 they cannot be combined with each other or with the exact\nfilters, and reject\
        \ `period=day` with a 400.\n\nAuthenticate with any valid OpenRouter API key (same key used for inference).\nRate-limited to 30 requests/minute per key and 500 requests/day per account.\n\nWhen\
        \ republishing or quoting this dataset, OpenRouter must be cited as:\n\"Source: OpenRouter (openrouter.ai/rankings), as of {as_of}.\"\n\nToken counts come from each upstream provider's own tokenizer\
        \ (Anthropic counts\nare as reported by Anthropic, OpenAI counts are as reported by OpenAI, etc.), so\na token in one row is not directly comparable to a token in another row from a\ndifferent provider.\n\
        \nLicensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/): reuse and republish with attribution to OpenRouter."
      operationId: getRankingsDaily
      parameters:
      - description: Start of the date window in YYYY-MM-DD (UTC), inclusive. Defaults to 30 days before `end_date`. The dataset begins at 2025-01-01; earlier values are clamped forward to that floor and
          the resolved value is echoed in `meta.start_date`.
        in: query
        name: start_date
        required: false
        schema:
          description: Start of the date window in YYYY-MM-DD (UTC), inclusive. Defaults to 30 days before `end_date`. The dataset begins at 2025-01-01; earlier values are clamped forward to that floor
            and the resolved value is echoed in `meta.start_date`.
          example: '2026-04-12'
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      - description: End of the date window in YYYY-MM-DD (UTC), inclusive. Defaults to the most recent completed UTC day. Must be on or after 2025-01-01; earlier values are rejected with a 400.
        in: query
        name: end_date
        required: false
        schema:
          description: End of the date window in YYYY-MM-DD (UTC), inclusive. Defaults to the most recent completed UTC day. Must be on or after 2025-01-01; earlier values are rejected with a 400.
          example: '2026-05-11'
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      - description: "Time grain of each row. `day` (default) returns the per-UTC-day series; `week` buckets by ISO week start; `month` buckets by month start. With `category` or `language_type` only `week`\
          \ (default) and `month` are available \u2014 `day` is rejected with a 400 because those datasets are aggregated weekly. For those sampled datasets `period=month` buckets each week by its week-start\
          \ month, so totals are approximate at month boundaries."
        in: query
        name: period
        required: false
        schema:
          description: "Time grain of each row. `day` (default) returns the per-UTC-day series; `week` buckets by ISO week start; `month` buckets by month start. With `category` or `language_type` only\
            \ `week` (default) and `month` are available \u2014 `day` is rejected with a 400 because those datasets are aggregated weekly. For those sampled datasets `period=month` buckets each week by\
            \ its week-start month, so totals are approximate at month boundaries."
          enum:
          - day
          - week
          - month
          example: day
          type: string
          x-speakeasy-unknown-values: allow
      - description: "Restrict to models for a modality surface: `text` / `image_output` match output modality, `image` / `audio` match input modality, and `tool_calling` keeps only rows that recorded at\
          \ least one tool call. Exact dataset \u2014 cannot be combined with `category` or `language_type`."
        in: query
        name: modality
        required: false
        schema:
          description: "Restrict to models for a modality surface: `text` / `image_output` match output modality, `image` / `audio` match input modality, and `tool_calling` keeps only rows that recorded\
            \ at least one tool call. Exact dataset \u2014 cannot be combined with `category` or `language_type`."
          enum:
          - text
          - image
          - image_output
          - audio
          - tool_calling
          example: text
          type: string
          x-speakeasy-unknown-values: allow
      - description: "Restrict to requests whose context length falls in this bucket (`1K`, `10K`, `100K`, `1M`, or `10M`). Exact dataset \u2014 cannot be combined with `category` or `language_type`."
        in: query
        name: context_bucket
        required: false
        schema:
          description: "Restrict to requests whose context length falls in this bucket (`1K`, `10K`, `100K`, `1M`, or `10M`). Exact dataset \u2014 cannot be combined with `category` or `language_type`."
          enum:
          - 1K
          - 10K
          - 100K
          - 1M
          - 10M
          example: 100K
          type: string
          x-speakeasy-unknown-values: allow
