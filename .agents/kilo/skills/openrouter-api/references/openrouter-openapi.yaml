          description: Sum of `prompt_tokens + completion_tokens` attributed to the app inside the date window, returned as a decimal string so 64-bit values are not truncated.
          example: '12345678'
          type: string
      required:
      - rank
      - app_id
      - app_name
      - total_tokens
      - total_requests
      type: object
