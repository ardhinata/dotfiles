        - app_id: 67890
          app_name: Roo Code
          rank: 2
          total_requests: 2109
          total_tokens: '9876543'
        meta:
          as_of: '2026-05-12T02:00:00.000Z'
          end_date: '2026-05-11'
          start_date: '2026-04-12'
          version: v1
      properties:
        data:
